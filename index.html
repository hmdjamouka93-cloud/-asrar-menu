<!DOCTYPE html>

    <title>منيو صالون أسرار الجمال</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            color: #ffffff;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
            max-width: 600px;
        }
        .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #d4af37;
            box-shadow: 0 0 15px rgba(212,175,55,0.3);
        }
        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .header h1 {
            color: #d4af37;
            font-size: 26px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .header p {
            color: #cccccc;
            font-size: 14px;
        }
        .menu-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .menu-page {
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            border: 1px solid #d4af37;
            cursor: pointer;
        }
        .menu-page img {
            width: 100%;
            height: auto;
            display: block;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* نافذة التكبير عند الضغط */
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.92);
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .modal img {
            max-width: 100%;
            max-height: 95vh;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(212,175,55,0.5);
        }
    </style>
</head>
